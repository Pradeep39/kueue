# Elastic batch Job: each Pod requests 100m CPU. Each parallelism increase creates a
# replacement Workload slice for the new count.
apiVersion: batch/v1
kind: Job
metadata:
  name: elastic
  namespace: wl-slice-quota-job
  labels:
    kueue.x-k8s.io/queue-name: wl-slice-quota-job
  annotations:
    kueue.x-k8s.io/elastic-job: "true"
spec:
  parallelism: 1
  suspend: true
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 0
      containers:
      - name: sleep
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
