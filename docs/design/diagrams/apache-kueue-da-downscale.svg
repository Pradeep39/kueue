<text x="1240" y="1285" font-size="11" text-anchor="middle" fill="#1f2933">lendable in the cohort again</text>
<text x="1240" y="1300" font-size="9.5" font-family="Menlo, monospace" text-anchor="middle" fill="#25506e">clusterqueue_controller.go:553</text>
<circle cx="2031" cy="1295" r="8.5" fill="#ffffff" stroke="#25506e" stroke-width="1.1"/><text x="2031" y="1298.5" font-size="9.5" font-weight="600" text-anchor="middle" fill="#25506e">15</text>
<rect x="44" y="1384" width="2124" height="80" rx="4" fill="#fdf6e3" stroke="#d9bc7a"/>
<text x="56" y="1401" font-size="11" fill="#7a5a12">The asymmetry this pair exists to show: scale-UP creates a Workload and traverses the full scheduler and preemption</text>
<text x="56" y="1416" font-size="11" fill="#7a5a12">path, because growing a grant needs a capacity check. Scale-DOWN is two in-place patches and never reaches the</text>
<text x="56" y="1431" font-size="11" fill="#7a5a12">scheduler, because giving quota back cannot fail. Both are driven by the same debounced Pod watch, which is the only</text>
<text x="56" y="1446" font-size="11" fill="#7a5a12">signal Kueue has. Note the Apache operator appears in neither flow.</text>
</svg>