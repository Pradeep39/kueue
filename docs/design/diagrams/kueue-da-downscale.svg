<text x="56" y="1535" font-size="11" fill="#7a5a12">Asymmetry worth remembering: scale-up creates a Workload and traverses the full scheduler + preemption path;</text>
<text x="56" y="1550" font-size="11" fill="#7a5a12">scale-down is two in-place patches and never reaches the scheduler. Both are driven by the same debounced Pod watch.</text>
