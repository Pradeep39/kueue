# Scenario P11-9-victims-round-robin
# Setup: setup/queues-tres.yaml, a standalone 36-slot ClusterQueue (36 CPU / 32256Mi), LocalQueue batch-queue-tres
# Wave 1 (9 low-priority static elastic apps, driver + 3 executors, floor 1) fills it; wave 2 (als-hi, static, driver + 14) once every executor runs.
# Judged by: req-check --slots 36 --preemption; pp-analyze --floor 1 --expect-whole 0
# Generated with: gen-apps.py <als-lo1..9:low> --queue batch-queue-tres --static-elastic 3 --floor 1 --als-args "1500 1500 12 40 200"  /  gen-apps.py als-hi:high --queue batch-queue-tres --static 14
# ---- wave 1
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: als-lo1
  namespace: batch-ns-uno
  annotations:
    kueue.x-k8s.io/elastic-job: "true"
  labels:
    kueue.x-k8s.io/queue-name: batch-queue-tres
    kueue.x-k8s.io/priority-class: low
spec:
  type: Scala
  mode: cluster
  image: docker.io/library/spark:4.0.1
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkALS
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples.jar
  arguments: ["1500", "1500", "12", "40", "200"]
  sparkVersion: 4.0.1
  sparkConf:
    "spark.kueue.preemption.minExecutors": "1"
    "spark.executor.instances": "3"
    "spark.kubernetes.executor.podNamePrefix": "als-lo1"
  driver:
    cores: 1
    memory: 512m
    serviceAccount: spark-operator-spark
    securityContext: &sc
      capabilities:
        drop: [ALL]
      runAsGroup: 185
      runAsUser: 185
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
  executor:
    cores: 1
    memory: 512m
    securityContext: *sc
---
