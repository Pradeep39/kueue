# Scenario P12-configurable-pool
# Setup: setup/queues-tres.yaml with spec.preemption.withinClusterQueue and reclaimWithinCohort Never and the
#   kueue.x-k8s.io/preemption-config-name: batch-pool annotation; setup/preemption-config-p12.yaml; the ConfigurablePreemptions
#   gate; integrations.labelKeysToCopy [preemption-pool, preemption-role] in Kueue's configuration.
# Wave 1: als-lo1..6 (default priority, preemption-pool=batch, driver + 3, floor 1) and als-lo7..10 (low priority, unlabeled, driver + 2, floor 1).
# Wave 2: als-hi (high priority, preemption-role=urgent, static driver + 11) once every executor runs.
# Judged by: req-check --slots 36 --preemption; pp-analyze --floor 1
# ---- wave 1
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: als-lo1
  namespace: batch-ns-uno
  annotations:
    kueue.x-k8s.io/elastic-job: "true"
  labels:
    preemption-pool: "batch"
    kueue.x-k8s.io/queue-name: batch-queue-tres
    kueue.x-k8s.io/priority-class: default
spec:
  type: Scala
  mode: cluster
  image: docker.io/library/spark:4.0.1
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkALS
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples.jar
  arguments: ["1500", "1500", "12", "40", "200"]
  sparkVersion: 4.0.1
  sparkConf:
    "spark.kueue.preemption.minExecutors": "1"
    "spark.executor.instances": "3"
    "spark.kubernetes.executor.podNamePrefix": "als-lo1"
  driver:
    cores: 1
    memory: 512m
    serviceAccount: spark-operator-spark
    securityContext: &sc
      capabilities:
        drop: [ALL]
      runAsGroup: 185
      runAsUser: 185
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
  executor:
    cores: 1
    memory: 512m
    securityContext: *sc
