# Queue setup used by every scenario (12-slot cohort: 2 x 6 CPU / 5376Mi; one slot = 1 CPU + 896Mi).
# Scenarios that need more room patch nominalQuota/borrowingLimit (see README, "Setup").
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Cohort
metadata:
  name: cohort-uno
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cluster-queue-uno
spec:
  cohortName: cohort-uno
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector: {}
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Any
    withinClusterQueue: LowerPriority
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources:
    - cpu
    - memory
    flavors:
    - name: default-flavor
      resources:
      - borrowingLimit: "6"
        name: cpu
        nominalQuota: "6"
      - borrowingLimit: 5376Mi
        name: memory
        nominalQuota: 5376Mi
  stopPolicy: None
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cluster-queue-dos
spec:
  cohortName: cohort-uno
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector: {}
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Any
    withinClusterQueue: LowerPriority
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources:
    - cpu
    - memory
    flavors:
    - name: default-flavor
      resources:
      - borrowingLimit: "6"
        name: cpu
        nominalQuota: "6"
      - borrowingLimit: 5376Mi
        name: memory
        nominalQuota: 5376Mi
  stopPolicy: None
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: batch-queue-uno
  namespace: batch-ns-uno
spec:
  clusterQueue: cluster-queue-uno
  stopPolicy: None
---
apiVersion: kueue.x-k8s.io/v1beta2
description: Default priority
kind: WorkloadPriorityClass
metadata:
  name: default
value: 1000
---
apiVersion: kueue.x-k8s.io/v1beta2
description: High priority
kind: WorkloadPriorityClass
metadata:
  name: high
value: 1500
---
apiVersion: kueue.x-k8s.io/v1beta2
description: Low priority
kind: WorkloadPriorityClass
metadata:
  name: low
value: 500
