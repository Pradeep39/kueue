# Demo part 5 (configurable preemption): a standalone 24-slot ClusterQueue (one slot = 1 CPU + 896Mi)
# with classic preemption turned off, so the PreemptionConfig below is the only way to preempt in it.
# Its rule lets apps labeled preemption-role=urgent take capacity from apps labeled
# preemption-pool=batch, whatever their priority. Apps without the pool label are never candidates,
# even at lower priority, and an app without the urgent label preempts nothing, even at higher priority.
#
# Needs Kueue with ConfigurablePreemptions=true, the PreemptionConfig CRD (v1alpha1), and
# integrations.labelKeysToCopy [preemption-pool, preemption-role] so the SparkApplication labels
# reach the Workloads that the selectors match.
---
apiVersion: kueue.x-k8s.io/v1alpha1
kind: PreemptionConfig
metadata:
  name: spark-batch-pool
spec:
  rules:
  - name: urgent-takes-from-batch-pool
    preemptorSelector:
      matchLabels:
        preemption-role: urgent
    activationPolicy:
      trigger: Always
    candidateSelectors:
    - scope: WithinClusterQueue
      labelSelector:
        matchLabels:
          preemption-pool: batch
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cluster-queue-quatro
  annotations:
    kueue.x-k8s.io/preemption-config-name: spark-batch-pool
spec:
  namespaceSelector: {}
  preemption:
    # Classic preemption off: the PreemptionConfig decides who can be preempted.
    withinClusterQueue: Never
    reclaimWithinCohort: Never
    borrowWithinCohort:
      policy: Never
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources: [cpu, memory]
    flavors:
    - name: default-flavor
      resources:
      - name: cpu
        nominalQuota: "24"
      - name: memory
        nominalQuota: 21504Mi
  stopPolicy: None
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: batch-queue-quatro
  namespace: batch-ns-uno
spec:
  clusterQueue: cluster-queue-quatro
  stopPolicy: None
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: batch-queue-quatro
  namespace: batch-ns-dos
spec:
  clusterQueue: cluster-queue-quatro
  stopPolicy: None
