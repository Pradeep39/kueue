# P12: classic preemption off on cluster-queue-tres; a PreemptionConfig rule is the only source of
# candidates. It selects Workloads labeled preemption-pool=batch, whatever their priority, for
# preemptors labeled preemption-role=urgent.
apiVersion: kueue.x-k8s.io/v1alpha1
kind: PreemptionConfig
metadata:
  name: batch-pool
spec:
  rules:
  - name: urgent-takes-from-batch-pool
    preemptorSelector:
      matchLabels:
        preemption-role: urgent
    activationPolicy:
      trigger: Always
    candidateSelectors:
    - scope: WithinClusterQueue
      labelSelector:
        matchLabels:
          preemption-pool: batch
