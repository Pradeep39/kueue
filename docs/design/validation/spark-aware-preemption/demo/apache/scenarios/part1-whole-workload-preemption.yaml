
# Part 1: whole-workload preemption (apache/run-whole-workload-preemption.sh), Spark 3.4.3.
# Queue: cluster-queue-tres sized to 12 slots for the run. Two low-priority SparkPageRank apps that have
# NOT opted in (no elastic annotation): driver + 4 executors each. Apply them first; once they run,
# apply the urgent app (third document), a high-priority SparkALS with Dynamic Allocation.
---
apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: workload-a
  namespace: batch-ns-dos
  labels:
    kueue.x-k8s.io/queue-name: batch-queue-tres
    kueue.x-k8s.io/priority-class: low
spec:
  mainClass: org.apache.spark.examples.SparkPageRank
  jars: local:///opt/spark/examples/jars/spark-examples_2.12-3.4.3.jar
  driverArgs:
  - file:///data/edges.txt
  - '100'
  runtimeVersions:
    sparkVersion: 3.4.3
  sparkConf:
    spark.kubernetes.container.image: docker.io/library/spark:3.4.3
    spark.kubernetes.container.image.pullPolicy: IfNotPresent
    spark.kubernetes.authenticate.driver.serviceAccountName: spark
    spark.kubernetes.executor.podNamePrefix: workload-a
    spark.driver.cores: '1'
    spark.kubernetes.driver.request.cores: 1000m
    spark.driver.memory: 512m
    spark.executor.cores: '1'
    spark.kubernetes.executor.request.cores: 1000m
    spark.executor.memory: 512m
    spark.executor.instances: '4'
    spark.sql.files.maxPartitionBytes: 2m
    spark.default.parallelism: '40'
    spark.driver.extraJavaOptions: -Xss64m
    spark.executor.extraJavaOptions: -Xss64m
  driverSpec:
    podTemplateSpec:
      metadata:
        labels:
          version: 3.4.3
      spec:
        containers:
        - name: spark-kubernetes-driver
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsGroup: 185
            runAsUser: 185
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
          - name: data
            mountPath: /data
        volumes:
        - name: data
          emptyDir: {}
        initContainers:
        - name: gen-edges
          image: docker.io/library/spark:3.4.3
          command:
          - sh
          - -c
          - awk "BEGIN{srand(42); for(i=0;i<2000000;i++) print int(rand()*200000),
            int(rand()*200000)}" > /data/edges.txt
          volumeMounts:
          - name: data
            mountPath: /data
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsGroup: 185
            runAsUser: 185
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
  executorSpec:
    podTemplateSpec:
      metadata:
        labels:
          version: 3.4.3
      spec:
        containers:
        - name: spark-kubernetes-executor
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsGroup: 185
            runAsUser: 185
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
          - name: data
            mountPath: /data
        volumes:
        - name: data
          emptyDir: {}
        initContainers:
        - name: gen-edges
          image: docker.io/library/spark:3.4.3
          command:
          - sh
          - -c
          - awk "BEGIN{srand(42); for(i=0;i<2000000;i++) print int(rand()*200000),
            int(rand()*200000)}" > /data/edges.txt
          volumeMounts:
          - name: data
            mountPath: /data
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsGroup: 185
            runAsUser: 185
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
