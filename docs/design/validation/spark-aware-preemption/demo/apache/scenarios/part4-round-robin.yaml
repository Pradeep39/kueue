
# Part 4: round-robin, p11s (apache/run-partial-preemption-spread.sh p11s), Spark 3.4.3.
# Queue: cluster-queue-tres sized to 20 slots. Five low-priority apps, driver + 3 executors, floor 1;
# then the urgent app (last document): static driver + 7 executors = 8 slots: one from each app, then
# a second from three.
---
apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: als-lo1
  namespace: batch-ns-dos
  labels:
    kueue.x-k8s.io/queue-name: batch-queue-tres
    kueue.x-k8s.io/priority-class: low
  annotations:
    kueue.x-k8s.io/elastic-job: 'true'
spec:
  mainClass: org.apache.spark.examples.SparkALS
  jars: local:///opt/spark/examples/jars/spark-examples_2.12-3.4.3.jar
  driverArgs:
  - '1500'
  - '1500'
  - '12'
  - '10'
  - '200'
  runtimeVersions:
    sparkVersion: 3.4.3
  sparkConf:
    spark.kubernetes.container.image: docker.io/library/spark:3.4.3
    spark.kubernetes.container.image.pullPolicy: IfNotPresent
    spark.kubernetes.authenticate.driver.serviceAccountName: spark
    spark.kubernetes.executor.podNamePrefix: als-lo1
    spark.driver.cores: '1'
    spark.kubernetes.driver.request.cores: 1000m
    spark.driver.memory: 512m
    spark.executor.cores: '1'
    spark.kubernetes.executor.request.cores: 1000m
    spark.executor.memory: 512m
    spark.executor.instances: '3'
    spark.kueue.preemption.minExecutors: '1'
  driverSpec:
    podTemplateSpec:
      metadata:
        labels:
          version: 3.4.3
      spec:
        containers:
        - name: spark-kubernetes-driver
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsGroup: 185
            runAsUser: 185
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
  executorSpec:
    podTemplateSpec:
      metadata:
        labels:
          version: 3.4.3
      spec:
        containers:
        - name: spark-kubernetes-executor
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsGroup: 185
            runAsUser: 185
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
