# Part 6: default preemption, with a floor of 1 (partial preemption) (run-default-preemption.sh --floor 1), Spark 3.4.3, Apache operator.
# Queue: cluster-queue-cinco (40 slots, queues-cinco.yaml). Ten low-priority static elastic apps, admitted one at a
# time in this order, executors 4 2 3 2 3 2 6 2 3 3, floor 1;
# then the urgent app: static, driver + 11.
# ---- als-lo1 (admitted 1st)
---
{
  "apiVersion": "spark.apache.org/v1",
  "kind": "SparkApplication",
  "metadata": {
    "name": "als-lo1",
    "namespace": "batch-ns-dos",
    "labels": {
      "kueue.x-k8s.io/queue-name": "batch-queue-cinco",
      "kueue.x-k8s.io/priority-class": "low"
    },
    "annotations": {
      "kueue.x-k8s.io/elastic-job": "true"
    }
  },
  "spec": {
    "mainClass": "org.apache.spark.examples.SparkALS",
    "jars": "local:///opt/spark/examples/jars/spark-examples_2.12-3.4.3.jar",
    "driverArgs": [
      "1500",
      "1500",
      "12",
      "100",
      "200"
    ],
    "runtimeVersions": {
      "sparkVersion": "3.4.3"
    },
    "sparkConf": {
      "spark.kubernetes.container.image": "docker.io/library/spark:3.4.3",
      "spark.kubernetes.container.image.pullPolicy": "IfNotPresent",
      "spark.kubernetes.authenticate.driver.serviceAccountName": "spark",
      "spark.kubernetes.executor.podNamePrefix": "als-lo1",
      "spark.driver.cores": "1",
      "spark.kubernetes.driver.request.cores": "1000m",
      "spark.driver.memory": "512m",
      "spark.executor.cores": "1",
      "spark.kubernetes.executor.request.cores": "1000m",
      "spark.executor.memory": "512m",
      "spark.executor.instances": "4",
      "spark.kueue.preemption.minExecutors": "1"
    },
    "driverSpec": {
      "podTemplateSpec": {
        "metadata": {
          "labels": {
            "version": "3.4.3"
          }
        },
        "spec": {
          "containers": [
            {
              "name": "spark-kubernetes-driver",
              "securityContext": {
                "capabilities": {
                  "drop": [
                    "ALL"
                  ]
                },
                "runAsGroup": 185,
                "runAsUser": 185,
                "runAsNonRoot": true,
                "allowPrivilegeEscalation": false,
                "seccompProfile": {
                  "type": "RuntimeDefault"
                }
              }
            }
          ]
        }
      }
    },
    "executorSpec": {
      "podTemplateSpec": {
        "metadata": {
          "labels": {
            "version": "3.4.3"
          }
        },
        "spec": {
          "containers": [
            {
              "name": "spark-kubernetes-executor",
              "securityContext": {
                "capabilities": {
                  "drop": [
                    "ALL"
                  ]
                },
                "runAsGroup": 185,
                "runAsUser": 185,
                "runAsNonRoot": true,
                "allowPrivilegeEscalation": false,
                "seccompProfile": {
                  "type": "RuntimeDefault"
                }
              }
            }
          ]
        }
      }
    }
  }
}
