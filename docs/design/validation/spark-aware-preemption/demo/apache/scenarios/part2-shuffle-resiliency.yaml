
# Part 2: shuffle resiliency (apache/run-shuffle-resiliency.sh), Spark 3.4.3.
# Queue: batch-queue-dos (cluster-queue-dos, the 12-slot cohort with cluster-queue-uno). A low-priority
# SparkPageRank app opted in with a floor of 2 (driver + 10 executors); apply the urgent app (second
# document) once every executor holds ~40 MiB of shuffle data.
---
apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: pr-victim
  namespace: batch-ns-dos
  labels:
    kueue.x-k8s.io/queue-name: batch-queue-dos
    kueue.x-k8s.io/priority-class: low
  annotations:
    kueue.x-k8s.io/elastic-job: 'true'
spec:
  mainClass: org.apache.spark.examples.SparkPageRank
  jars: local:///opt/spark/examples/jars/spark-examples_2.12-3.4.3.jar
  driverArgs:
  - file:///data/edges.txt
  - '100'
  runtimeVersions:
    sparkVersion: 3.4.3
  sparkConf:
    spark.kubernetes.container.image: docker.io/library/spark:3.4.3
    spark.kubernetes.container.image.pullPolicy: IfNotPresent
    spark.kubernetes.authenticate.driver.serviceAccountName: spark
    spark.kubernetes.executor.podNamePrefix: pr-victim
    spark.driver.cores: '1'
    spark.kubernetes.driver.request.cores: 1000m
    spark.driver.memory: 512m
    spark.executor.cores: '1'
    spark.kubernetes.executor.request.cores: 1000m
    spark.executor.memory: 512m
    spark.executor.instances: '10'
    spark.kueue.preemption.minExecutors: '2'
    spark.sql.files.maxPartitionBytes: 2m
    spark.default.parallelism: '40'
    spark.driver.extraJavaOptions: -Xss64m
    spark.executor.extraJavaOptions: -Xss64m
    spark.kubernetes.executor.terminationGracePeriodSeconds: 30s
  driverSpec:
    podTemplateSpec:
      metadata:
        labels:
          version: 3.4.3
      spec:
        containers:
        - name: spark-kubernetes-driver
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsGroup: 185
            runAsUser: 185
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
          - name: data
            mountPath: /data
        volumes:
        - name: data
          emptyDir: {}
        initContainers:
        - name: gen-edges
          image: docker.io/library/spark:3.4.3
          command:
          - sh
          - -c
          - awk "BEGIN{srand(42); for(i=0;i<2000000;i++) print int(rand()*200000),
            int(rand()*200000)}" > /data/edges.txt
          volumeMounts:
          - name: data
            mountPath: /data
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsGroup: 185
            runAsUser: 185
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
  executorSpec:
    podTemplateSpec:
      metadata:
        labels:
          version: 3.4.3
      spec:
        containers:
        - name: spark-kubernetes-executor
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsGroup: 185
            runAsUser: 185
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
          - name: data
            mountPath: /data
        volumes:
        - name: data
          emptyDir: {}
        initContainers:
        - name: gen-edges
          image: docker.io/library/spark:3.4.3
          command:
          - sh
          - -c
          - awk "BEGIN{srand(42); for(i=0;i<2000000;i++) print int(rand()*200000),
            int(rand()*200000)}" > /data/edges.txt
          volumeMounts:
          - name: data
            mountPath: /data
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsGroup: 185
            runAsUser: 185
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: urgent
  namespace: batch-ns-dos
  labels:
    kueue.x-k8s.io/queue-name: batch-queue-dos
    kueue.x-k8s.io/priority-class: high
  annotations:
    kueue.x-k8s.io/elastic-job: 'true'
    kueue.x-k8s.io/elastic-job-scale-up-strategy: partial
spec:
  mainClass: org.apache.spark.examples.SparkALS
  jars: local:///opt/spark/examples/jars/spark-examples_2.12-3.4.3.jar
  driverArgs:
  - '1500'
  - '1500'
  - '12'
  - '30'
  - '200'
  runtimeVersions:
    sparkVersion: 3.4.3
  sparkConf:
    spark.kubernetes.container.image: docker.io/library/spark:3.4.3
    spark.kubernetes.container.image.pullPolicy: IfNotPresent
    spark.kubernetes.authenticate.driver.serviceAccountName: spark
    spark.kubernetes.executor.podNamePrefix: urgent
    spark.driver.cores: '1'
    spark.kubernetes.driver.request.cores: 1000m
    spark.driver.memory: 512m
    spark.executor.cores: '1'
    spark.kubernetes.executor.request.cores: 1000m
    spark.executor.memory: 512m
    spark.dynamicAllocation.enabled: 'true'
    spark.dynamicAllocation.shuffleTracking.enabled: 'true'
    spark.dynamicAllocation.minExecutors: '3'
    spark.dynamicAllocation.maxExecutors: '30'
    spark.dynamicAllocation.schedulerBacklogTimeout: 2s
    spark.dynamicAllocation.executorIdleTimeout: 5s
    spark.kubernetes.allocation.maxPendingPods: '2'
  driverSpec:
    podTemplateSpec:
      metadata:
        labels:
          version: 3.4.3
      spec:
        containers:
        - name: spark-kubernetes-driver
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsGroup: 185
            runAsUser: 185
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
  executorSpec:
    podTemplateSpec:
      metadata:
        labels:
          version: 3.4.3
      spec:
        containers:
        - name: spark-kubernetes-executor
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsGroup: 185
            runAsUser: 185
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
