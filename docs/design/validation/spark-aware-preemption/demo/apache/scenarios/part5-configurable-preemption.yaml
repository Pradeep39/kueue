# Part 5: configurable preemption (run-configurable-preemption.sh), Spark 3.4.3, Apache Spark Operator.
# Queue: cluster-queue-quatro (../queues-quatro.yaml, 24 slots), classic preemption Never, PreemptionConfig spark-batch-pool.
# Wave 1: als-lo1..4 (default, preemption-pool=batch) and als-lo5..6 (low, no pool label), driver + 3, floor 1.
# Step 1: plain-hi (high, no preemption-role label) waits and preempts nothing; it is then deleted.
# Step 2: als-hi (high, preemption-role=urgent), driver + 3: the pool apps give 1 executor each.
---
{
  "apiVersion": "spark.apache.org/v1",
  "kind": "SparkApplication",
  "metadata": {
    "name": "als-lo1",
    "namespace": "batch-ns-dos",
    "labels": {
      "preemption-pool": "batch",
      "kueue.x-k8s.io/queue-name": "batch-queue-quatro",
      "kueue.x-k8s.io/priority-class": "default"
    },
    "annotations": {
      "kueue.x-k8s.io/elastic-job": "true"
    }
  },
  "spec": {
    "mainClass": "org.apache.spark.examples.SparkALS",
    "jars": "local:///opt/spark/examples/jars/spark-examples_2.12-3.4.3.jar",
    "driverArgs": [
      "1500",
      "1500",
      "12",
      "12",
      "200"
    ],
    "runtimeVersions": {
      "sparkVersion": "3.4.3"
    },
    "sparkConf": {
      "spark.kubernetes.container.image": "docker.io/library/spark:3.4.3",
      "spark.kubernetes.container.image.pullPolicy": "IfNotPresent",
      "spark.kubernetes.authenticate.driver.serviceAccountName": "spark",
      "spark.kubernetes.executor.podNamePrefix": "als-lo1",
      "spark.driver.cores": "1",
      "spark.kubernetes.driver.request.cores": "1000m",
      "spark.driver.memory": "512m",
      "spark.executor.cores": "1",
      "spark.kubernetes.executor.request.cores": "1000m",
      "spark.executor.memory": "512m",
      "spark.executor.instances": "3",
      "spark.kueue.preemption.minExecutors": "1"
    },
    "driverSpec": {
      "podTemplateSpec": {
        "metadata": {
          "labels": {
            "version": "3.4.3"
          }
        },
        "spec": {
          "containers": [
            {
              "name": "spark-kubernetes-driver",
              "securityContext": {
                "capabilities": {
                  "drop": [
                    "ALL"
                  ]
                },
                "runAsGroup": 185,
                "runAsUser": 185,
                "runAsNonRoot": true,
                "allowPrivilegeEscalation": false,
                "seccompProfile": {
                  "type": "RuntimeDefault"
                }
              }
            }
          ]
        }
      }
    },
    "executorSpec": {
      "podTemplateSpec": {
        "metadata": {
          "labels": {
            "version": "3.4.3"
          }
        },
        "spec": {
          "containers": [
            {
              "name": "spark-kubernetes-executor",
              "securityContext": {
                "capabilities": {
                  "drop": [
                    "ALL"
                  ]
                },
                "runAsGroup": 185,
                "runAsUser": 185,
                "runAsNonRoot": true,
                "allowPrivilegeEscalation": false,
                "seccompProfile": {
                  "type": "RuntimeDefault"
                }
              }
            }
          ]
        }
      }
    }
  }
}
