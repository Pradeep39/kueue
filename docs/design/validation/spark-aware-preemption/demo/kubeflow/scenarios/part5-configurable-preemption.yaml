# Part 5: configurable preemption (run-configurable-preemption.sh), Spark 3.4.3, Kubeflow operator.
# Queue: cluster-queue-quatro (../queues-quatro.yaml, 24 slots), classic preemption Never, PreemptionConfig spark-batch-pool.
# Wave 1: als-lo1..4 (default, preemption-pool=batch) and als-lo5..6 (low, no pool label), driver + 3, floor 1.
# Step 1: plain-hi (high, no preemption-role label) waits and preempts nothing; it is then deleted.
# Step 2: als-hi (high, preemption-role=urgent), driver + 3: the pool apps give 1 executor each.
# ---- wave 1
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: als-lo1
  namespace: batch-ns-uno
  annotations:
    kueue.x-k8s.io/elastic-job: "true"
  labels:
    preemption-pool: "batch"
    kueue.x-k8s.io/queue-name: batch-queue-quatro
    kueue.x-k8s.io/priority-class: default
spec:
  type: Scala
  mode: cluster
  image: docker.io/library/spark:3.4.3
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkALS
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples_2.12-3.4.3.jar
  arguments: ["1500", "1500", "12", "12", "200"]
  sparkVersion: 3.4.3
  sparkConf:
    "spark.kueue.preemption.minExecutors": "1"
    "spark.kubernetes.executor.podNamePrefix": "als-lo1"
  driver:
    cores: 1
    memory: 512m
    serviceAccount: spark-operator-spark
    securityContext: &sc
      capabilities:
        drop: [ALL]
      runAsGroup: 185
      runAsUser: 185
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
  executor:
    cores: 1
    memory: 512m
    instances: 3
    securityContext: *sc
