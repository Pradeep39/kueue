
# Part 4: round-robin, p11s (run-partial-preemption-spread.sh p11s), Spark 3.4.3, Kubeflow operator.
# Queue: cluster-queue-tres sized to 20 slots. Five apps, driver + 3 executors, floor 1; urgent: driver + 7.
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: als-lo1
  namespace: batch-ns-uno
  annotations:
    kueue.x-k8s.io/elastic-job: "true"
  labels:
    kueue.x-k8s.io/queue-name: batch-queue-tres
    kueue.x-k8s.io/priority-class: low
spec:
  type: Scala
  mode: cluster
  image: docker.io/library/spark:3.4.3
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkALS
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples_2.12-3.4.3.jar
  arguments: ["1500", "1500", "12", "10", "200"]
  sparkVersion: 3.4.3
  sparkConf:
    "spark.kueue.preemption.minExecutors": "1"
    "spark.executor.instances": "3"
    "spark.kubernetes.executor.podNamePrefix": "als-lo1"
  driver:
    cores: 1
    memory: 512m
    serviceAccount: spark-operator-spark
    securityContext: &sc
      capabilities:
        drop: [ALL]
      runAsGroup: 185
      runAsUser: 185
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
  executor:
    cores: 1
    memory: 512m
    securityContext: *sc
